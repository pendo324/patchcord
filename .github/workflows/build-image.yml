name: Build container image

on:
  push:
    branches: [main]
    paths:
      - docker/build.Dockerfile
      - .github/workflows/build-image.yml
  schedule:
    # Rebuild weekly even with no Dockerfile changes -- the image tracks
    # fedora:latest plus dnf's rolling zig/rustup/pipewire-devel/
    # pulseaudio-libs-devel packages, so its actual contents drift over
    # time independent of this repo's own history.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/build.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/patchcord-builder:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish-manifest:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish combined manifest
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/patchcord-builder
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.sha }}" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
