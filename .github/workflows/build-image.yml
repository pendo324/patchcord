name: Build container image

on:
  push:
    branches: [pipewire-native-backend]
    paths:
      - docker/build.Dockerfile
      - .github/workflows/build-image.yml
  schedule:
    # Rebuild weekly even with no Dockerfile changes -- the image tracks
    # fedora:latest plus dnf's rolling zig/rustup/pipewire-devel/
    # pulseaudio-libs-devel packages, so its actual contents drift over
    # time independent of this repo's own history.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/patchcord-builder:latest
            ghcr.io/${{ github.repository_owner }}/patchcord-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
